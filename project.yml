name: Cartons
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
targets:
  Cartons:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - app/Cartons
      - app/Shared
      - Cartons.icon
      - Tuck.icon
      - path: fonts
        includes: ["*.ttf"]
        buildPhase: resources
    info:
      path: app/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.nulljosh.carton.refresh]
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: app/Cartons.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups: [group.com.nulljosh.carton]
    dependencies:
      - target: CartonsWidgets
        destinationFilters: [iOS]
      - target: CartonsShare
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: Cartons
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": Tuck
        "ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphone*]": YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cartons
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": app/Cartons-macOS.entitlements
        MARKETING_VERSION: 1.0.0
        "MARKETING_VERSION[sdk=iphone*]": 1.1.0  # widgets, Live Activity and share are iPhone only
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  CartonsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [app/Widgets, app/Shared]
    info:
      path: app/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cartons
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: app/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nulljosh.carton]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton.widgets
        DEVELOPMENT_TEAM: QMM486NPYC
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  CartonsShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [app/Share, app/Shared]
    info:
      path: app/Share/Info.plist
      properties:
        CFBundleDisplayName: Cartons
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: app/Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nulljosh.carton]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.carton.share
        DEVELOPMENT_TEAM: QMM486NPYC
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
